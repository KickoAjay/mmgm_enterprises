name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # No Supabase/Cashfree/Resend secrets required — every build-time
      # data read (sitemap.ts) degrades gracefully without them, and
      # every other route is server-rendered on demand, not built here.
      - run: pnpm build
